name: Generate Profile Images

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Cloudregh
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Fetch stats cards
        run: |
          sudo chown -R "$(id -u)" dist
          fetch() {
            # A missing card shouldn't fail the run; fall back to yesterday's copy.
            if curl -sfL -m 60 --retry 3 -A "Mozilla/5.0" -o "$1.tmp" "$2" && grep -q "<svg" "$1.tmp"; then
              mv "$1.tmp" "dist/$1"
            else
              echo "::warning::could not fetch $1, keeping previous copy"
              curl -sfL -o "dist/$1" "https://raw.githubusercontent.com/${{ github.repository }}/output/$1" || true
            fi
            rm -f "$1.tmp"
          }
          fetch stats.svg     "https://github-readme-stats.vercel.app/api?username=Cloudregh&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117"
          fetch top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=Cloudregh&layout=compact&theme=radical&hide_border=true&bg_color=0D1117"
          fetch streak.svg    "https://streak-stats.demolab.com/?user=Cloudregh&theme=radical&hide_border=true&background=0D1117"

      - name: Push images to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
